# Доступ к модели для бейзлайнов B1–B4 и систем участников.
#
# Решение по issue #12: модель дёргается по OpenAI-совместимому API с ключом, а
# не грузится весами. Транспорт ровно один, и к конкретному бэкенду он не
# привязан: подойдёт локальный vLLM, университетский шлюз или сторонний
# провайдер — разница только в адресе. Поэтому адрес, идентификатор модели и
# ключ живут в `.env`, а не здесь:
#
#   SCIAUDIT_BASE_URL   например http://localhost:8000/v1 или https://api.host/v1
#   SCIAUDIT_MODEL      идентификатор модели, он же попадёт в system_info.model
#   SCIAUDIT_API_KEY    ключ
#
# КЛЮЧ НИКОГДА НЕ ХРАНИТСЯ В ЭТОМ ФАЙЛЕ и не передаётся в командной строке:
# её видно в `ps` и она остаётся в истории оболочки. Шаблон — `.env.example`,
# сам `.env` в `.gitignore`.

# Имя переменной окружения с ключом. Меняйте, если у вас принято другое.
api_key_env: SCIAUDIT_API_KEY

# Параметры запроса. Одинаковы для любого эндпоинта.
request_defaults:
  # У reasoning-моделей рассуждение списывается из этого же бюджета, а ответ
  # идёт после него. На 512 gpt-oss успевает только додумать: content приходит
  # пустым при finish_reason=length. Ответ аудита занимает ~150 токенов,
  # остальное — запас на рассуждение.
  max_tokens: 2048
  temperature: 0.0                # §6.1 требует воспроизводимости
  # seed передаётся эндпоинту, если тот его понимает. Разброс он уменьшает, но
  # не снимает: на облачном инференсе два одинаковых прогона всё равно
  # расходятся (замер — в docs/b1_vs_b2.md). Число прогонов, а не seed,
  # решает вопрос сравнимости систем.
  seed: 7
  timeout_seconds: 60
  max_retries: 3                  # экспоненциальная задержка на 429 и 5xx

# Политика §7.4 мануала ограничивает САМУ МОДЕЛЬ, а не способ доступа к ней:
# оцениваемая система обязана работать на одобренной открытой модели. Проверка
# выполняется на этапе скоринга по `system_info.model` в предсказаниях.
#
# Пустой список означает «список ещё не утверждён»: прогоны идут, но ни один не
# считается лидербордным. Заполняется штабом идентификаторами моделей ровно в
# том виде, в каком их возвращает эндпоинт.
approved_models: []
