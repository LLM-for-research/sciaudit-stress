[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sciaudit-stress"
version = "0.0.1"
description = "SciAudit-Stress: стресс-тестирование достаточности evidence для аудита эмпирических ML-утверждений — центральная публичная рельса."
requires-python = ">=3.10"
dependencies = []

# Инструменты разработки (PEP 735). Ставятся по умолчанию через `uv sync`.
# Добавить ещё: `uv add --dev <pkg>`.
[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4",
    "pyyaml>=6",
]

[tool.setuptools.packages.find]
include = ["sciaudit*"]
