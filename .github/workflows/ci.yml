name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установка uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Синхронизация по локфайлу
        run: uv sync --locked
      - name: Юнит-тесты
        run: uv run pytest tests/ -q
      - name: Smoke-прогон system_template
        run: |
          uv run python system_template/run.py \
            --input examples/sample_inputs.jsonl \
            --output /tmp/predictions.jsonl
      - name: Smoke-прогон бейзлайна B0
        run: |
          uv run python -m sciaudit.baselines.b0_always_insufficient \
            --input examples/sample_inputs.jsonl \
            --output /tmp/b0.jsonl

      - name: Валидация примеров входов (схема + утечки)
        run: uv run python -m sciaudit.schemas.validate_inputs examples/sample_inputs.jsonl
      - name: Валидация примеров предсказаний
        run: |
          uv run python -m sciaudit.schemas.validate_predictions \
            examples/sample_predictions.jsonl --input examples/sample_inputs.jsonl
      - name: Валидация предсказаний B0
        run: |
          uv run python -m sciaudit.schemas.validate_predictions /tmp/b0.jsonl \
            --input examples/sample_inputs.jsonl

      # --- Бейзлайны на модели: прогоняются с детерминированной заглушкой.
      # Доступа к модели в CI нет (issue #12), но точка входа, ретрив, разбор
      # ответа и контракт выхода обязаны проверяться на каждом коммите: именно
      # мёртвый CLI однажды проехал мимо зелёного CI.
      - name: Smoke-прогон бейзлайна B1
        run: |
          uv run python -m sciaudit.baselines.b1_bm25_llm \
            --input examples/sample_inputs.jsonl \
            --output /tmp/b1.jsonl --top-k 2 \
            --model-command "python -m sciaudit.baselines.stub_model" \
            --model-name ci-stub-not-a-model
      - name: Smoke-прогон бейзлайна B2
        run: |
          uv run python -m sciaudit.baselines.b2_fullpack_llm \
            --input examples/sample_inputs.jsonl \
            --output /tmp/b2.jsonl \
            --model-command "python -m sciaudit.baselines.stub_model" \
            --model-name ci-stub-not-a-model
      - name: Валидация предсказаний B1 и B2
        run: |
          uv run python -m sciaudit.schemas.validate_predictions /tmp/b1.jsonl \
            --input examples/sample_inputs.jsonl
          uv run python -m sciaudit.schemas.validate_predictions /tmp/b2.jsonl \
            --input examples/sample_inputs.jsonl

      # --- Ворота утечки: §10.1–§10.4 и §5.5 ---
      - name: Скан запрещённых ключей (ворота утечки)
        run: |
          uv run python -m sciaudit.leakage.forbidden_key_scan \
            data_public/ examples/ data_paper_derived/ --verbose
      - name: Аудит пересечения сплитов
        run: |
          uv run python -m sciaudit.leakage.split_overlap_check \
            examples data_public/public_warmup data_public/public_dev

      # Пробы на утечку метки. Каждая учит слабую модель на признаках, которых
      # для вердикта быть недостаточно, и сравнивает её с перестановочным
      # распределением. Порог утечки p < 0.05, подозрение печатается и
      # пропускает: на десятках инстансов граница широкая, и гейт, краснеющий
      # на шуме, перестают читать.
      - name: Проба на метаданных (§10.2)
        run: |
          for split in public_warmup public_dev; do
            uv run python -m sciaudit.leakage.metadata_probe \
              --inputs "data_public/$split/inputs.jsonl" \
              --gold "data_public/$split/gold.jsonl"
          done
      - name: Проба на одном claim (§10.3)
        run: |
          for split in public_warmup public_dev; do
            uv run python -m sciaudit.leakage.claim_only_probe \
              --inputs "data_public/$split/inputs.jsonl" \
              --gold "data_public/$split/gold.jsonl"
          done
      - name: Проверка идентификаторов (§5.5)
        run: |
          uv run python -m sciaudit.leakage.id_randomness_check \
            --inputs examples/sample_inputs.jsonl \
                     data_public/public_warmup/inputs.jsonl \
                     data_public/public_dev/inputs.jsonl
          uv run python -m sciaudit.leakage.id_randomness_check \
            --inputs data_public/public_dev/inputs.jsonl \
            --gold data_public/public_dev/gold.jsonl

      # --- Репетиция скрытой оценки: седьмой шаг стандарта готовности §8.1 ---
      # Нарезка по группам, экспорт студенческой половины без gold, прогон B0 по
      # ней, валидация и скоринг на штабной стороне. Модель не дёргается, так что
      # шаг ничего не стоит и гоняется на каждом коммите.
      - name: Репетиция скрытой оценки (§8.1, §10.5)
        run: |
          uv run python -m sciaudit.evaluator.hidden_dry_run \
            --internal data_paper_derived/*.internal_annotation.jsonl \
            --by seed

      # --- Замкнутый readiness-loop на публичных данных (§8.1) ---
      # inputs -> validate -> B0 -> validate predictions -> evaluator -> metrics
      - name: Валидация публичных warm-up входов
        run: |
          uv run python -m sciaudit.schemas.validate_inputs \
            data_public/public_warmup/inputs.jsonl
      - name: Прогон B0 на публичном warm-up
        run: |
          uv run python -m sciaudit.baselines.b0_always_insufficient \
            --input data_public/public_warmup/inputs.jsonl \
            --output /tmp/b0_warmup.jsonl
      - name: Валидация warm-up предсказаний
        run: |
          uv run python -m sciaudit.schemas.validate_predictions /tmp/b0_warmup.jsonl \
            --input data_public/public_warmup/inputs.jsonl
      - name: Оценка warm-up через evaluator
        run: |
          uv run python -m sciaudit.evaluator.score \
            --pred /tmp/b0_warmup.jsonl \
            --gold data_public/public_warmup/gold.jsonl \
            --out /tmp/warmup_metrics.json \
            --report /tmp/warmup_report.md
      - name: Публикация warm-up метрик в сводку прогона
        run: cat /tmp/warmup_report.md >> "$GITHUB_STEP_SUMMARY"

      # --- B3: тот же пак, что у B2, плюс детерминированная проверка чисел ---
      - name: Smoke-прогон B3 с заглушкой
        run: |
          uv run python -m sciaudit.baselines.b3_checked_llm \
            --input data_public/public_warmup/inputs.jsonl \
            --output /tmp/b3_warmup.jsonl \
            --model-command "python -m sciaudit.baselines.stub_model" \
            --model-name deterministic-stub-not-a-model
      - name: Валидация предсказаний B3
        run: |
          uv run python -m sciaudit.schemas.validate_predictions /tmp/b3_warmup.jsonl

      # --- B4: тот же пак, ансамбль голосов и пять правил отказа (§11.6) ---
      # Порог поставлен в 0, чтобы smoke-прогон проверял ветку ответа: у
      # заглушки уверенность низкая, и с боевым порогом B4 отказался бы на всех
      # инстансах, а сломанный путь ответа остался бы незамеченным.
      - name: Smoke-прогон B4 с заглушкой
        run: |
          uv run python -m sciaudit.baselines.b4_selective \
            --input data_public/public_warmup/inputs.jsonl \
            --output /tmp/b4_warmup.jsonl \
            --model-command "python -m sciaudit.baselines.stub_model" \
            --model-name deterministic-stub-not-a-model \
            --votes 2 --confidence-threshold 0.0
      - name: Валидация предсказаний B4
        run: |
          uv run python -m sciaudit.schemas.validate_predictions /tmp/b4_warmup.jsonl

      # --- Контроль B1 против B2 (§11.4): помогает ли ретрив ---
      - name: Сравнение B1 и B2 на публичном warm-up
        run: |
          uv run python -m sciaudit.baselines.compare_baselines \
            --input data_public/public_warmup/inputs.jsonl \
            --gold data_public/public_warmup/gold.jsonl \
            --out /tmp/baselines_compared.md
          cat /tmp/baselines_compared.md >> "$GITHUB_STEP_SUMMARY"
      # --- Тот же цикл на срезе из настоящих статей (§8.1) ---
      - name: Валидация входов public_dev
        run: |
          uv run python -m sciaudit.schemas.validate_inputs \
            data_public/public_dev/inputs.jsonl
      - name: Прогон B0 на public_dev
        run: |
          uv run python -m sciaudit.baselines.b0_always_insufficient \
            --input data_public/public_dev/inputs.jsonl \
            --output /tmp/b0_dev.jsonl
      - name: Оценка public_dev через evaluator
        run: |
          # --stress включает срезы §12.6 и отказ по стресс-типу §12.5. Стресс-тип
          # приватен, поэтому срезы считаются только здесь, на штабной стороне, и
          # никогда не выводятся из публичного gold.
          uv run python -m sciaudit.evaluator.score \
            --pred /tmp/b0_dev.jsonl \
            --gold data_public/public_dev/gold.jsonl \
            --stress data_paper_derived/*.internal_annotation.jsonl \
            --out /tmp/dev_metrics.json \
            --report /tmp/dev_report.md
          cat /tmp/dev_report.md >> "$GITHUB_STEP_SUMMARY"

      # --- Доступ к модели настроен? В CI ключа нет, поэтому только проверка,
      # что конфиг читается и клиент честно сообщает, чего не хватает (issue #12).
      - name: Проверка конфигурации доступа к модели
        # Секреты репозитория не попадают в шаг сами — их нужно назвать здесь
        # поимённо. На PR из форка GitHub их не отдаёт вовсе, поэтому шаг
        # обязан переживать их отсутствие, а не требовать.
        env:
          SCIAUDIT_BASE_URL: ${{ secrets.SCIAUDIT_BASE_URL }}
          SCIAUDIT_MODEL: ${{ secrets.SCIAUDIT_MODEL }}
          SCIAUDIT_API_KEY: ${{ secrets.SCIAUDIT_API_KEY }}
        run: |
          # Код 1 («не готов») прощается: на форках секретов нет, и это не
          # повод валить сборку. Не прощается код 2 — нечитаемый или сломанный
          # configs/models.yaml; он должен валить CI, а не тонуть в `|| true`.
          uv run python -m sciaudit.baselines.model_client --check; status=$?
          if [ "$status" -ge 2 ]; then
            echo "configs/models.yaml не читается (код $status)"; exit 1
          fi
          if [ "$status" -eq 0 ]; then
            echo "Доступ к модели настроен: секреты видны шагу."
          else
            echo "Секретов нет (форк или они не заданы) — прогоны по API недоступны."
          fi

      - name: Загрузка warm-up метрик как артефакта
        uses: actions/upload-artifact@v4
        with:
          name: warmup-metrics
          path: |
            /tmp/warmup_metrics.json
            /tmp/warmup_report.md

  # --- §6.4: образ шаблона системы обязан собираться и запускаться ---
  # Отдельной задачей, а не шагом: сборка образа не зависит от тестов, и при
  # падении сразу видно, что сломалось — рельса или контейнер.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установка uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Синхронизация по локфайлу
        run: uv sync --locked

      - name: Сборка образа шаблона системы
        run: |
          set -o pipefail
          docker build -t sciaudit-system-template system_template/ 2>&1 | tee /tmp/build.log
      - name: Образ собран по локфайлу, а не резолвом на месте
        run: |
          if grep -q "НЕ воспроизводим" /tmp/build.log; then
            echo "system_template/uv.lock отсутствует в контексте сборки:"
            echo "образ невоспроизводим, §6.4 не выполнен."
            exit 1
          fi

      # Контракт запуска — тот же, по которому команды сдают системы:
      # вход монтируется только на чтение, предсказания пишутся в /output.
      - name: Прогон образа по контракту
        run: |
          mkdir -p /tmp/container_out
          docker run --rm \
            -v "$PWD/data_public/public_warmup:/input:ro" \
            -v /tmp/container_out:/output \
            sciaudit-system-template \
            python run.py --input /input/inputs.jsonl --output /output/predictions.jsonl
      - name: Предсказания из образа валидны по схеме
        run: |
          uv run python -m sciaudit.schemas.validate_predictions \
            /tmp/container_out/predictions.jsonl \
            --input data_public/public_warmup/inputs.jsonl
      - name: Образ выдал по предсказанию на каждый вход
        run: |
          inputs=$(wc -l < data_public/public_warmup/inputs.jsonl)
          preds=$(wc -l < /tmp/container_out/predictions.jsonl)
          echo "входов $inputs, предсказаний $preds"
          test "$inputs" -eq "$preds"
