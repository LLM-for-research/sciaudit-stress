name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (locked)
        run: uv sync --locked
      - name: Unit tests
        run: uv run pytest tests/ -q
      - name: Smoke run system_template
        run: |
          uv run python system_template/run.py \
            --input examples/sample_inputs.jsonl \
            --output /tmp/predictions.jsonl
      - name: Smoke run B0 baseline
        run: |
          uv run python -m sciaudit.baselines.b0_always_insufficient \
            --input examples/sample_inputs.jsonl \
            --output /tmp/b0.jsonl

      # --- Readiness loop on the public warm-up slice (staff manual §8.1) ---
      - name: Run B0 on public warm-up
        run: |
          uv run python -m sciaudit.baselines.b0_always_insufficient \
            --input data_public/public_warmup/inputs.jsonl \
            --output /tmp/b0_warmup.jsonl
      - name: Validate warm-up predictions
        run: |
          uv run python -m sciaudit.schemas.validate_predictions /tmp/b0_warmup.jsonl \
            --input data_public/public_warmup/inputs.jsonl
      - name: Evaluate warm-up (B0 vs gold)
        run: |
          uv run python -m sciaudit.evaluator.score \
            --pred /tmp/b0_warmup.jsonl --gold data_public/public_warmup/gold.jsonl \
            --out /tmp/warmup_metrics.json
      - name: Guard warm-up metrics
        run: |
          uv run python -c "import json; m = json.load(open('/tmp/warmup_metrics.json')); assert m['counts']['gold_instances'] >= 10, m; assert m['counts']['invalid_predictions'] == 0, m; assert m['counts']['missing_predictions'] == 0, m"

      - name: Validate example inputs (schema + leakage)
        run: uv run python -m sciaudit.schemas.validate_inputs examples/sample_inputs.jsonl
      - name: Validate example predictions
        run: |
          uv run python -m sciaudit.schemas.validate_predictions \
            examples/sample_predictions.jsonl --input examples/sample_inputs.jsonl
      - name: Validate B0 predictions
        run: |
          uv run python -m sciaudit.schemas.validate_predictions /tmp/b0.jsonl \
            --input examples/sample_inputs.jsonl

      - name: Forbidden-key scan (leakage gate)
        run: |
          uv run python -m sciaudit.leakage.forbidden_key_scan \
            data_public/ examples/ --verbose
