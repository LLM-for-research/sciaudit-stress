[project]
name = "sciaudit-system"
version = "0.0.1"
description = "Система SciAudit-Stress (шаблон под форк)."
requires-python = ">=3.11"
# Рантайм-зависимости добавляйте ЗАКРЕПЛЁННЫМИ через `uv add`, например `uv add transformers==4.44.2`.
# Оцениваемые системы обязаны работать на одобренных открытых моделях (мануал §7.4).
dependencies = []

# Это приложение (run.py), а не устанавливаемый пакет — uv управляет только зависимостями.
[tool.uv]
package = false
